name: Production foundation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'scripts/verify-production.sh'
      - '.github/workflows/production-foundation.yml'
      - 'software_project_docs/H_Development_Implementation/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'scripts/verify-production.sh'
      - '.github/workflows/production-foundation.yml'
      - 'software_project_docs/H_Development_Implementation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Verify production foundation
        shell: bash
        run: bash scripts/verify-production.sh
