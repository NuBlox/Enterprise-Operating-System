name: Production foundation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'scripts/verify-production.sh'
      - '.github/workflows/production-foundation.yml'
      - 'software_project_docs/H_Development_Implementation/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'scripts/verify-production.sh'
      - '.github/workflows/production-foundation.yml'
      - 'software_project_docs/H_Development_Implementation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: nublox_production_test
          POSTGRES_USER: nublox_migrator
          POSTGRES_PASSWORD: nublox_migrator_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nublox_migrator -d nublox_production_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      NUBLOX_POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=nublox_production_test;Username=nublox_migrator;Password=nublox_migrator_ci_only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Verify production foundation
        shell: bash
        run: bash scripts/verify-production.sh
