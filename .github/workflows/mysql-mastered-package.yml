name: NuBlox MySQL mastered package

on:
  pull_request:
    paths:
      - 'packages/mastered/mysql/**'
      - '.github/workflows/mysql-mastered-package.yml'
      - '.github/workflows/sync-mysql-mastered-package.yml'
  push:
    branches: [main]
    paths:
      - 'packages/mastered/mysql/**'
      - '.github/workflows/mysql-mastered-package.yml'
      - '.github/workflows/sync-mysql-mastered-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: packages/mastered/mysql
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/mastered/mysql/package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Load callback and promise entry points
        run: node -e "require('./'); require('./promise');"

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Verify publish surface
        run: npm pack --dry-run
