name: Review MySQL upstream candidate

on:
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: mysqljs/mysql commit SHA to review
        required: true
        default: dc9c152a87ec51a1f647447268917243d2eab1fd

permissions:
  contents: read

concurrency:
  group: review-mysql-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      PACKAGE_DIR: packages/mastered/mysql
    steps:
      - name: Checkout NuBlox repository
        uses: actions/checkout@v4

      - name: Validate upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.upstream_commit }}'
          if [[ ! "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            echo "upstream_commit must be a full 40-character Git SHA" >&2
            exit 1
          fi
          echo "sha=$requested" >> "$GITHUB_OUTPUT"

      - name: Fetch immutable upstream candidate
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/mysqljs-mysql"
          git clone --filter=blob:none --no-checkout https://github.com/mysqljs/mysql.git "$upstream"
          git -C "$upstream" fetch --depth=1 origin "${{ steps.upstream.outputs.sha }}"
          git -C "$upstream" checkout --detach "${{ steps.upstream.outputs.sha }}"
          test "$(git -C "$upstream" rev-parse HEAD)" = "${{ steps.upstream.outputs.sha }}"
          rm -rf "$upstream/.git"

      - name: Build review artifact
        shell: bash
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/mysqljs-mysql"
          artifact="$RUNNER_TEMP/mysql-upstream-review"
          mkdir -p "$artifact"
          printf '%s\n' '${{ steps.upstream.outputs.sha }}' > "$artifact/upstream-commit.txt"
          tar -C "$upstream" -czf "$artifact/upstream-candidate.tar.gz" .
          git diff --no-index --stat -- "$PACKAGE_DIR" "$upstream" > "$artifact/diff-stat.txt" || true
          git diff --no-index -- "$PACKAGE_DIR" "$upstream" > "$artifact/diff.patch" || true
          {
            echo "# MySQL upstream review"
            echo
            echo "Candidate: ${{ steps.upstream.outputs.sha }}"
            echo
            echo "The mastered package is never modified by this workflow."
            echo "Apply upstream changes selectively through a normal NuBlox pull request."
          } > "$artifact/README.md"

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: mysql-upstream-${{ steps.upstream.outputs.sha }}
          path: ${{ runner.temp }}/mysql-upstream-review
          retention-days: 30
