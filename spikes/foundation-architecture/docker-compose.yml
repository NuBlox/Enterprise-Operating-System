services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: nublox_spike
      POSTGRES_USER: nublox
      POSTGRES_PASSWORD: nublox_spike_dev_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nublox -d nublox_spike"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - nublox_spike_postgres:/var/lib/postgresql

volumes:
  nublox_spike_postgres:
